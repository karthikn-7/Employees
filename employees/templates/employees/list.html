<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees</title>
</head>
<body>
    <h1>Employees</h1>
    {% for emp in employees %}
        <p>{{ emp.id }} {{ emp.name }} - {{ emp.department }} <a href="http://127.0.0.1:8000/employees/update/{{ emp.id }}">Update</a></p>
    {% endfor %}

    <a href="{% url 'employee_create' %}">Create Employee</a>
</body>
</html>
